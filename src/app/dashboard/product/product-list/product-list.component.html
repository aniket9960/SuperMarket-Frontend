<div class="container my-3">
    <div class="row">
      <div class="col-md-12 d-flex justify-content-md-end">
        <span><input class="form-control" type="text" placeholder="Search By Name"></span>
        <button class="btn btn-info ms-3" routerLink="addProduct" >Add Product</button>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <h2>Products List</h2>
        <h5 class="text-secondary">Total Products : {{count}}</h5>
      <div class="table-responsive rounded ">
        <table class="table table-hover table-bordered border-primary">
          <thead class="thead-dark table-dark">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">HSN Number</th>
              <th scope="col">Rate</th>
              <th scope="col">Discount</th>
              <th scope="col">GST</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of Products; let i = index">
              <th scope="row">{{ i+1 }}</th>
              <td>{{ product.name }}</td>
              <td>{{ product.hsn }}</td>
              <td>{{ product.rate }}</td>
              <td>{{ product.discount }}</td>
              <td>{{ product.gst }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      </div>
    </div>    
    </div>
