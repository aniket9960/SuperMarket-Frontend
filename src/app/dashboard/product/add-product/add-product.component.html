<div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <div class="card cardbody-color mt-2">
          <form [formGroup]="productForm" (submit)="onSubmit()" class="card-body">
            <div class="card-title text-center">
                <img src="https://img.icons8.com/bubbles/100/product.png" alt="product"
                class="img-fluid profile-image-pic img-thumbnail rounded-circle " width="150px" alt="profile">
              <h1 class="display-4">Add Product</h1>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group form-floating mb-3">
                  <input type="text" id="name" class="form-control" placeholder="" formControlName="productName">
                  <label for="name">Name</label>
                </div>
                <div class="form-group form-floating mb-3">
                    <input type="number" id="rate" class="form-control" placeholder="" formControlName="rate">
                    <label for="rate">Rate</label>
                  </div>
                <div class="form-group form-floating mb-3">
                    <input type="number" id="discount" class="form-control" placeholder="" formControlName="discount">
                    <label for="discount">Discount</label>
                </div>  
              </div>
              <div class="col-md-6">
                <div class="form-group form-floating mb-3">
                    <input type="number" id="hsn" class="form-control" placeholder="" formControlName="hsn">
                    <label for="hsn">HSN</label>
                  </div>
                <div class="form-group form-floating mb-3">
                  <input type="number" id="gst" class="form-control" placeholder="" formControlName="gst">
                  <label for="gst">GST</label>
                </div>                
              </div>
            </div>
            <div class="row">
              <div class="col-md-12 d-flex justify-content-center">
                <button type="submit" class="btn btn-s btn-block">Add Product</button>
              </div>
            </div>
  
          </form>
          <div class="row">
            <div class="col-md-12 d-flex justify-content-center">
              <button class="btn btn-back btn-block my-3" routerLink="../">Back</button>
            </div>
          </div>
  
        </div>
  
      </div>
    </div>
  </div>
